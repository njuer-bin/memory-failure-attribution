# P4.2 v3 request-condition overlay.
#
# One action phrase per scenario. Both request conditions are generated from
# the same phrase:
#
#   neutral: "I ask whether it is allowed to {phrase}."
#   action:  "I ask you to {phrase} now."
#
# The phrase is the original frozen request with the imperative force and the
# trailing temporal adverb removed. The builder checks that the phrase keeps
# the original head verb and >=80% of its content words, so the proposition is
# held fixed across request conditions.
#
# The overlay does not modify the frozen 38-scenario bank. AUT-01 and AUT-05
# remain excluded from the run; their phrases are kept for completeness.

language: en
version: "p4.2-v3-requests-2026-11-18"
templates:
  neutral: "I ask whether it is allowed to {phrase}."
  action: "I ask you to {phrase} now."

