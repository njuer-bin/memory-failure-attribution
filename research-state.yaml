hypotheses:
  - id: H1
    statement: "Compression strategies differ in status preservation."
    status: supported
    motivation: "Baseline measurement before claiming a phenomenon."
    parent: null
    priority: high
    note: "30-run: status-aware 256/270 both-correct vs neutral 221/270; pairwise 43 vs 8."
  - id: H2
    statement: "Recursive compression may add status drift beyond one-shot compression."
    status: supported-conditionally
    motivation: "Central recursion claim; requires paired recursive-vs-direct comparison."
    parent: null
    priority: high
    note: "Supported under the neutral writer. v2.3 shows rewrite-matched equals recursive and both are much worse than direct, so repeated chained rewriting rather than budget shrinkage drives the effect. P3 confirms with human labels: omission among preserved 44.4% recursive vs 3.7% direct; rewrite-matched 46.2%; repeated-direct 3.7%; source-peek 0%. The dominant outcome is status omission, not unsupported distortion (3/330)."
  - id: H3
    statement: "Proposition retention does not guarantee status retention."
    status: supported
    motivation: "Motivates CPSD as a separate metric from omission."
    parent: null
    priority: high
    note: "P3: 88/300 proposition-preserved items are status omissions; PLR is 10-20% in chained conditions, so omission is not explained by proposition loss. Unsupported distortion is rare (3/300)."
  - id: H4
    statement: "Status-only corruption may independently alter downstream decisions."
    status: supported-for-distortion
    motivation: "Stage B downstream behavior; tested by P4."
    parent: null
    priority: high
    note: "P4: distorted status raises unauthorized action from 6.7% to 66.7% (paired +0.600, CI [0.433,0.767]). Omitted status does not raise unauthorized action (0/30) but lowers evidence-consistent action by 26.7 points. The effect is real for distortion, not for omission on this task."
  - id: H5
    statement: "A status-preserving writer can reduce status omission without unacceptable budget inflation."
    status: supported
    motivation: "P5 mitigation; confirmatory run and v3.2.4 recheck complete."
    parent: null
    priority: high
    note: "v3.2.4 recheck (kappa 0.974): status_aware 27/30 faithful vs neutral 14/26 at 1.05x; source access alone 30/30 at 1.23x; combination 28/30 at 1.38x with a negative interaction (-0.500). Source access is the stronger mitigation; status_aware is a partial fallback. The prompt's gain is real but smaller than source access."

