hypotheses:
  - id: H1
    statement: "Compression strategies differ in status preservation."
    status: supported
    motivation: "Baseline measurement before claiming a phenomenon."
    parent: null
    priority: high
    note: "30-run: status-aware 256/270 both-correct vs neutral 221/270; pairwise 43 vs 8."
  - id: H2
    statement: "Recursive compression may add status drift beyond one-shot compression."
    status: supported-conditionally
    motivation: "Central recursion claim; requires paired recursive-vs-direct comparison."
    parent: null
    priority: high
    note: "Supported under the neutral writer. v2.3 shows rewrite-matched (constant intermediate budgets) equals recursive and both are much worse than direct, so repeated chained rewriting rather than budget shrinkage drives the effect. Not observed under the status-aware writer."
  - id: H3
    statement: "Proposition retention does not guarantee status retention."
    status: supported
    motivation: "Motivates CPSD as a separate metric from omission."
    parent: null
    priority: high
    note: "Neutral proposition omission 1.1% in v3 and 0-2/30 in v2.3 while status errors are far more frequent."
  - id: H4
    statement: "Status-only corruption may independently alter downstream decisions."
    status: pending
    motivation: "Later Stage B; not tested by the current pilot."
    parent: null
    priority: low

